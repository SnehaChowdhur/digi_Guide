version: "3.9"

services:
  postgres:
    image: "pgvector/pgvector:pg16"
    environment:
      POSTGRES_DB: learning_twin
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: twin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  postgres_data:
